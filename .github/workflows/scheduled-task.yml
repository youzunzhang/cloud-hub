name: Scheduled Task

# 用途：云端定时执行任务（替代本地 cron / 计划任务），保留产物为 Artifact
# 使用的 GitHub 功能：Actions（schedule cron）、workflow_dispatch 手动触发、
#                     Actions Artifacts、GITHUB_TOKEN 只读上下文
#
# ⚠️ cron 一律按 UTC 解释：
#     北京 07:00 = UTC 前一日 23:00  →  "0 23 * * *"
#     北京 09:00 = UTC 当日 01:00    →  "0 1 * * *"
# ⚠️ 公共仓库的定时任务在长期无提交后会被 GitHub 自动停用（60 天），
#    需要到 Actions 页面手动 Enable，或让 workflow_dispatch 定期跑一次。

on:
  schedule:
    # 每天 北京 07:00
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "任务名（见 cloudhub list）"
        required: true
        default: "hello"
      dry_run:
        description: "只演练不落盘"
        type: boolean
        default: false

concurrency:
  group: scheduled-${{ github.event.inputs.task || 'hello' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run:
    name: run ${{ github.event.inputs.task || 'hello' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 执行任务
        env:
          TASK: ${{ github.event.inputs.task || 'hello' }}
          CLOUDHUB_OUTPUT_DIR: output
          CLOUDHUB_LOG_LEVEL: INFO
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            cloudhub run "$TASK" --json --dry-run | tee output.json
          else
            cloudhub run "$TASK" --json | tee output.json
          fi

      - name: 上传任务产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-${{ github.event.inputs.task || 'hello' }}-${{ github.run_id }}
          path: |
            output.json
            output/
          if-no-files-found: warn
          retention-days: 30
