name: Release

# 用途：推送 v*.*.* tag 时自动构建并创建 GitHub Release，附带 wheel/sdist/站点包
# 使用的 GitHub 功能：Releases、Tags、Actions、GITHUB_TOKEN 自动权限、自动生成发布说明

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "要补发 Release 的已有 tag（如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 构建
        run: python -m build

      - name: 打包站点
        run: |
          cd site && zip -qr ../site.zip . && cd ..
          ls -lh dist site.zip

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/* site.zip
