name: Deploy Pages

# 用途：把 site/ 目录发布到 GitHub Pages
# 使用的 GitHub 功能：Pages（artifact 型部署）、Environments、OIDC（id-token）
#
# ⚠️ 前置条件（GitHub 硬约束，无法用工作流绕开）：
#   必须在仓库 Settings → Pages → Build and deployment → Source 选 “GitHub Actions”。
#   官方说明：configure-pages 的 enablement 输入「requires a token other than GITHUB_TOKEN」，
#   即用默认 GITHUB_TOKEN 无法自动开通 Pages，必须由仓库管理员点一次。
#   开通后再推一次 site/ 或在本工作流点 Run workflow 即可发布。
#   另：Free 账号的私有仓库不支持 Pages，需 Pro/Team 或改公开仓库。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 打包站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        # 注意：这里刻意不加 enablement: true —— 该选项要求提供非 GITHUB_TOKEN 的凭据，
        # 用默认 token 一定失败。Pages 的首次开通请在仓库设置页完成（见文件头注释）。

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
