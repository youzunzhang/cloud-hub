name: CodeQL

# 用途：Python 代码静态安全扫描，结果进 Security → Code scanning
# 使用的 GitHub 功能：Code scanning（CodeQL）、Actions、security-events 权限
#
# ⚠️ 计划限制（2026-10-25 核对官方文档 Code scanning → Who can use this feature）：
#   代码扫描仅对「公开仓库」或「已购 GitHub Code Security 的组织仓库」可用。
#   → 个人账号 + 私有仓库时本工作流会失败/无结果，请按下面二选一处理：
#     ① 仓库改公开（最省事）；
#     ② 删除本文件，改在 ci.yml 里跑 ruff + pip-audit（免费，无需 GHAS）。


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 20 * * 0" # 每周一 北京 04:00

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: 执行分析
        uses: github/codeql-action/analyze@v4
