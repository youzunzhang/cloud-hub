name: CI

# 用途：lint / 测试 / 构建 三件套，作为所有 PR 与 main 的准入闸门
# 使用的 GitHub 功能：Actions（workflow / matrix / concurrency / cache / artifacts）

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交会取消上一次未完成的运行，省额度也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Windows 运行器默认 en-US 码表，Python 输出被重定向时打印中文会 UnicodeEncodeError。
  # 显式声明 UTF-8，与 cli.py 内的流重配置形成双保险。
  PYTHONIOENCODING: "utf-8"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format 校验
        run: ruff format --check .

  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Windows 只跑一个版本：够验证路径/编码类问题，又不浪费额度
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

      - name: CLI 冒烟（check / list / run --dry-run）
        run: |
          cloudhub check
          cloudhub list
          cloudhub run hello --dry-run --json

  build:
    name: build (wheel + sdist + site)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 构建 wheel 与 sdist
        run: python -m build

      - name: 打包站点
        run: |
          cd site && zip -qr ../site.zip . && cd ..
          ls -lh dist site.zip

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: |
            dist/*
            site.zip
          if-no-files-found: error
          retention-days: 14
