[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cloudhub"
dynamic = ["version"]
description = "以 GitHub 为默认云端的任务执行与交付基础框架"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "youzunzhang" }]
keywords = ["github-actions", "automation", "scheduled-tasks", "pages"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "build>=1.2",
  "pre-commit>=3.7",
]

[project.scripts]
cloudhub = "cloudhub.cli:main"

[project.urls]
Homepage = "https://github.com/youzunzhang/cloud-hub"
Issues = "https://github.com/youzunzhang/cloud-hub/issues"

[tool.hatch.version]
path = "src/cloudhub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudhub"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "CHANGELOG.md", "pyproject.toml"]

# ---------------- Ruff：lint + format 单一工具 ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "site"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
]
ignore = [
  "E501", # 行长由 formatter 控制
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------- pytest ----------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
